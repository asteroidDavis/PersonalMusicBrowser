repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path music_browser/Cargo.toml -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path music_browser/Cargo.toml -- -D warnings
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-test
        name: cargo test (with PocketBase ACL integration tests)
        entry: music_browser/scripts/run-pocketbase-integration-tests.sh
        language: system
        pass_filenames: false
        files: \.(rs|sql|html|js)$
