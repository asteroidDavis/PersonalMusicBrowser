# istio/istiod on a ~4 GB host (upstream requests 2 Gi for pilot).
pilot:
  autoscaleEnabled: false
  replicaCount: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 384Mi}
  env:
    PILOT_ENABLE_STATUS: "false"
global:
  proxy:
    resources:
      requests: {cpu: 10m, memory: 40Mi}
      limits: {memory: 128Mi}
meshConfig:
  accessLogFile: ""
  enablePrometheusMerge: false
  defaultConfig:
    concurrency: 1
