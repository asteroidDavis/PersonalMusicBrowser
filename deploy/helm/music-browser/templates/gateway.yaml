{{- if .Values.gateway.enabled }}
{{- $hosts := list .Values.hostname }}
{{- if .Values.gateway.exposePocketbase }}{{ $hosts = append $hosts (printf "pb.%s" .Values.hostname) }}{{ end }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: music-browser
  namespace: {{ .Values.gateway.namespace }}
  labels: {{- include "mb.labels" . | nindent 4 }}
spec:
  selector: {{- toYaml .Values.gateway.selector | nindent 4 }}
  servers:
    - port: {number: {{ .Values.gateway.httpsPort }}, name: https, protocol: HTTPS}
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.gateway.tlsSecretName }}
        minProtocolVersion: TLSV1_2
      hosts: {{- toYaml $hosts | nindent 8 }}
    - port: {number: {{ .Values.gateway.httpPort }}, name: http, protocol: HTTP}
      hosts: {{- toYaml $hosts | nindent 8 }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: music-browser
  labels: {{- include "mb.labels" . | nindent 4 }}
spec:
  hosts: [{{ .Values.hostname | quote }}]
  gateways: ["{{ .Values.gateway.namespace }}/music-browser"]
  http:
    - match:
        - port: {{ .Values.gateway.httpPort }}
      redirect:
        scheme: https
        redirectCode: 308
    - route:
        - destination:
            host: music-browser.{{ .Release.Namespace }}.svc.cluster.local
            port: {number: {{ .Values.musicBrowser.port }}}
      headers:
        response:
          set:
            Strict-Transport-Security: max-age=31536000
{{- if .Values.gateway.exposePocketbase }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: pocketbase
  labels: {{- include "mb.labels" . | nindent 4 }}
spec:
  hosts: ["pb.{{ .Values.hostname }}"]
  gateways: ["{{ .Values.gateway.namespace }}/music-browser"]
  http:
    - match:
        - port: {{ .Values.gateway.httpPort }}
      redirect: {scheme: https, redirectCode: 308}
    - route:
        - destination:
            host: pocketbase.{{ .Release.Namespace }}.svc.cluster.local
            port: {number: {{ .Values.pocketbase.port }}}
{{- end }}
{{- end }}
